# KTH2-R temperature / humidity sensor (T and RH x10), as on the mbus-gw-t2r test stand.
# T and RH drift as a sawtooth; the base differs per line (line_step), so a crossed line shows up at once.
# Registers 0x1000.. and 0x2000.. are emulator-only: who answered (line, unit) and a 125-register block.
name: kth2r
description: KTH2-R T/RH sensor (T, RH x10; passport, address, corrections, test registers)
functions: [3, 4, 6, 8, 16]
holding:
  - {addr: 0x0000, name: "model 1, firmware 0x0120", values: [0x0001, 0x0120]}
  - {addr: 0x0002, name: "name", string: "KTH2-R"}
  - {addr: 0x000C, name: "Modbus address (FC 6 writes 1..247)", special: unit, rw: true}
  - {addr: 0x000D, name: "speed code (7 = 115200)", special: speed_code}
  - {addr: 0x000E, name: "parity code (0 N, 1 E, 2 O)", special: parity_code}
  - {addr: 0x0300, name: "temperature, °C x10 (+ correction 0x04FF)", type: int16, add: 0x04FF,  # 21.0 + 1.0*line +-0.5, period 120 s
     wave: {shape: saw, base: 210, line_step: 10, amp: 5, period: 120}}
  - {addr: 0x0301, name: "humidity, % x10 (+ correction 0x0500)", add: 0x0500,              # 30.0 + 1.0*line +-1.0, period 180 s
     wave: {shape: saw, base: 300, line_step: 10, amp: 10, period: 180}}
  - {addr: 0x04FF, name: "corrections of T and RH, x10", count: 2, type: int16, value: 0, rw: true}
  - {addr: 0x1000, name: "test: served hi/lo, line, unit, baud/100", specials: [served_hi, served_lo, line, unit, baud100]}
  - {addr: 0x2000, name: "test: 125 registers", count: 125, rw: true,   # 0x1000*(line+1) + 0x100*unit + i
     base: 0x1000, line_step: 0x1000, unit_step: 0x100, index_step: 1}
